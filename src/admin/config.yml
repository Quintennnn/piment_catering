          - label: "Blok 1 — tekst"
            name: "weddings_text"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "markdown" }
              - { label: "English", name: "en", widget: "markdown" }

          - { label: "Blok 1 — foto (staand uitgesneden)", name: "weddings_image", widget: "image" }

          - label: "Blok 2 (zakelijk) — klein label"
            name: "business_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Blok 2 — titel"
            name: "business_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Blok 2 — tekst"
            name: "business_text"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "markdown" }
              - { label: "English", name: "en", widget: "markdown" }

          - { label: "Blok 2 — foto (liggend)", name: "business_image", widget: "image" }

          - label: "Formuliertitel"
            name: "form_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Formulier intro"
            name: "form_intro"
            widget: "object"
            collapsed: true
            fields:
