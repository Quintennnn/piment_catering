  - name: "vacatures"
    label: "Vacatures"
    label_singular: "Vacature"
    folder: "src/_data/vacatures"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    summary: "{{title.nl}}"
    fields:
      - label: "Functietitel"
        name: "title"
        widget: "object"
        fields:
          - { label: "Nederlands", name: "nl", widget: "string" }
          - { label: "English", name: "en", widget: "string" }

      - label: "Categorie (chip, optioneel)"
        name: "category"
        widget: "object"
        required: false
        hint: "bv. Keuken / Kitchen"
        fields:
          - { label: "Nederlands", name: "nl", widget: "string", required: false }
          - { label: "English", name: "en", widget: "string", required: false }

      - label: "Korte samenvatting (optioneel)"
        name: "summary"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Nederlands", name: "nl", widget: "text", required: false }
          - { label: "English", name: "en", widget: "text", required: false }

      - label: "Volledige omschrijving"
        name: "description"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Nederlands", name: "nl", widget: "markdown" }
          - { label: "English", name: "en", widget: "markdown" }

      - label: "Sollicitatie-instructie (optioneel)"
        name: "contact_text"
        widget: "object"
        required: false
        fields:
          - { label: "Nederlands", name: "nl", widget: "string", required: false }
          - { label: "English", name: "en", widget: "string", required: false }

  # ----------------------------------------------------------------------
  # Agenda (één bestand per evenement, getoond op de evenementenpagina)
  # ----------------------------------------------------------------------
  - name: "agenda"
    label: "Agenda"
    label_singular: "Evenement"
    description: "Komende evenementen, zoals workshops. Ze staan op de evenementenpagina en verdwijnen vanzelf als de datum voorbij is."
    folder: "src/_data/agenda"
    create: true
    delete: true
    slug: "{{fields.date}}-{{title.nl}}"
    extension: "json"
    format: "json"
    summary: "{{date}} · {{title.nl}}"
    sortable_fields:
      - { field: "date", label: "Datum", default_sort: asc }
      - title.nl
    fields:
      - { label: "Datum", name: "date", widget: "datetime", type: "date" }

      - { label: "Tijd (optioneel)", name: "time", widget: "string", required: false, hint: "bv. 18.30 - 20.30" }

      - label: "Prijs (optioneel)"
        name: "price"
        widget: "object"
        required: false
        hint: "Staat naast de datum en tijd, bv. €25,- p.p."
        fields:
          - { label: "Nederlands", name: "nl", widget: "string", required: false }
          - { label: "English", name: "en", widget: "string", required: false }

      - label: "Titel"
        name: "title"
        widget: "object"
        fields:
          - { label: "Nederlands", name: "nl", widget: "string" }
          - { label: "English", name: "en", widget: "string" }

      - label: "Soort (chip, optioneel)"
        name: "category"
        widget: "object"
        required: false
        hint: "bv. Workshop"
        fields:
          - { label: "Nederlands", name: "nl", widget: "string", required: false }
          - { label: "English", name: "en", widget: "string", required: false }

      - label: "Korte regel onder de titel (optioneel)"
        name: "summary"
        widget: "object"
        required: false
        fields:
          - { label: "Nederlands", name: "nl", widget: "string", required: false }
          - { label: "English", name: "en", widget: "string", required: false }

      - { label: "Foto (optioneel)", name: "image", widget: "image", required: false }

      - label: "Volledige omschrijving"
        name: "description"
        widget: "object"
        collapsed: true
        hint: "De eerste alinea staat altijd in beeld. De rest verschijnt als bezoekers op 'Lees meer' klikken."
        fields:
          - { label: "Nederlands", name: "nl", widget: "markdown" }
          - { label: "English", name: "en", widget: "markdown" }

      - { label: "Knop 'Aanmelden per mail' tonen", name: "signup_button", widget: "boolean", default: true, required: false }

  # ----------------------------------------------------------------------
  # Menukaart (één bestand per categorie)
  # ----------------------------------------------------------------------
  - name: "menu"
    label: "Menukaart"
    label_singular: "Menucategorie"
    folder: "src/_data/menu"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    summary: "{{category.nl}}"
    fields:
      - { label: "Volgorde op de pagina", name: "order", widget: "number", value_type: "int", default: 1, hint: "1 = bovenaan. Lunchkaart = 1, Warme dranken = 2, Koude frisdrank en sap = 3" }

      - label: "Categorienaam (bv. Lunchkaart, Warme dranken)"
        name: "category"
        widget: "object"
        fields:
          - { label: "Nederlands", name: "nl", widget: "string" }
          - { label: "English", name: "en", widget: "string" }

      - label: "Gerechten"
        name: "items"
        widget: "list"
        summary: "{{fields.name.nl}} – {{fields.price}}"
        fields:
          - label: "Naam"
            name: "name"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Omschrijving (optioneel)"
            name: "description"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text", required: false }
              - { label: "English", name: "en", widget: "text", required: false }

          - { label: "Prijs", name: "price", widget: "string" }

  # ----------------------------------------------------------------------
  # Reviews / Testimonials
  # ----------------------------------------------------------------------
  - name: "testimonials"
    label: "Reviews (homepage)"
    files:
      - label: "Reviews"
        name: "testimonials"
        file: "src/_data/testimonials.json"
        fields:
          - label: "Sectietitel"
            name: "title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Reviews"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Naam", name: "name", widget: "string" }
              - { label: "Aantal sterren (1-5)", name: "rating", widget: "number", min: 1, max: 5, default: 5 }
              - label: "Quote"
                name: "quote"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Nederlands", name: "nl", widget: "text" }
                  - { label: "English", name: "en", widget: "text" }
