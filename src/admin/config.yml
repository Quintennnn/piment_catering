              - { label: "English", name: "en", widget: "markdown" }

          - label: "Chips (categorieën)"
            name: "chips"
            widget: "object"
            collapsed: true
            fields:
              - label: "Nederlands"
                name: "nl"
                widget: "list"
                field: { label: "Chip", name: "chip", widget: "string" }
              - label: "English"
                name: "en"
                widget: "list"
                field: { label: "Chip", name: "chip", widget: "string" }

          - label: "Galerij (sfeerimpressies)"
            name: "gallery"
            widget: "list"
            field: { label: "Foto", name: "image", widget: "image" }

          - label: "Galerij-titel"
            name: "gallery_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Formuliertitel"
            name: "form_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Formulier intro"
            name: "form_intro"
            widget: "object"
            collapsed: true
