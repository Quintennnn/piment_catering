# Login via GitHub (OAuth loopt via Netlify, zie CMS-HANDLEIDING.md in de projectroot)
backend:
  name: github
  repo: Quintennnn/piment_catering
  branch: main
  base_url: https://api.netlify.com

media_folder: "src/assets/images"
public_folder: "/assets/images"

# Geen preview-paneel in de editor; de velden zelf zijn duidelijk genoeg.
editor:
  preview: false

# Vertaalbare velden gebruiken het object-widget met NL/EN sub-velden.
# Lange velden (text/markdown) zijn standaard ingeklapt om de editor overzichtelijk te houden.

collections:

  # ----------------------------------------------------------------------
  # Site-wide settings (logo, contact, address, navigation)
  # ----------------------------------------------------------------------
  - name: "settings"
    label: "Site-instellingen"
    files:
      - label: "Algemeen"
        name: "site"
        file: "src/_data/site.json"
        fields:
          - { label: "Sitenaam", name: "name", widget: "string" }

          - { label: "Logo (header, footer en favicon)", name: "logo", widget: "image" }

          - { label: "Hoedje (embleem rechtsboven in de header)", name: "emblem", widget: "image", required: false }

          - label: "Tagline (kort)"
            name: "tagline"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Footer tekst"
            name: "footer_text"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Algemeen telefoonnummer (zichtbaar)", name: "phone", widget: "string", hint: "bv. 06 2734 1234 — staat in de footer en op de contactpagina" }
              - { label: "Algemeen telefoonnummer (zonder spaties)", name: "phone_link", widget: "string", hint: "bv. 0627341234" }
              - { label: "Telefoon catering / Jimy (zichtbaar)", name: "catering_phone", widget: "string", required: false, hint: "Staat alleen op de cateringpagina" }
              - { label: "Telefoon catering / Jimy (zonder spaties)", name: "catering_phone_link", widget: "string", required: false }
              - { label: "E-mailadres", name: "email", widget: "string" }

          - label: "Adres lunchcafé"
            name: "lunchcafe_address"
            widget: "object"
            fields:
              - label: "Naam locatie"
                name: "name"
                widget: "object"
                fields:
                  - { label: "Nederlands", name: "nl", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }
              - { label: "Locatie / landgoed", name: "location", widget: "string" }
              - { label: "Straat + huisnummer", name: "street", widget: "string" }
              - { label: "Plaats", name: "city", widget: "string" }
              - label: "Openingstijden"
                name: "hours"
                widget: "object"
                fields:
                  - { label: "Nederlands", name: "nl", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }

          - label: "Postadres"
            name: "postal_address"
            widget: "object"
            fields:
              - { label: "Straat + huisnummer", name: "street", widget: "string" }
              - { label: "Postcode", name: "postcode", widget: "string" }
              - { label: "Plaats", name: "city", widget: "string" }

          - { label: "KvK-nummer", name: "kvk", widget: "string" }

          - label: "Social media (optioneel)"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }

          - label: "Navigatiemenu"
            name: "nav"
            widget: "list"
            summary: "{{fields.key}} → {{fields.url}}"
            hint: "De zichtbare tekst van de menu-items beheer je in de UI-vertalingen (vraag de developer)."
            fields:
              - { label: "Sleutel", name: "key", widget: "string", hint: "home, lunchcafe, catering, events, about, vacancies, contact" }
              - { label: "URL", name: "url", widget: "string", hint: "bv. /lunchcafe/" }

  # ----------------------------------------------------------------------
  # Pages
  # ----------------------------------------------------------------------
  - name: "pages"
    label: "Pagina's"
    format: "frontmatter"
    extension: "njk"
    files:

      - label: "Home"
        name: "home"
        file: "src/index.njk"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }

          - label: "Browser-titel"
            name: "title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Meta description"
            name: "description"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

          # --- Hero ---
          - label: "Hero — klein label"
            name: "hero_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Hero — titel"
            name: "hero_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Hero — tekst"
            name: "hero_text"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

          - { label: "Hero — hoofdfoto", name: "hero_image_main", widget: "image" }
          - { label: "Hero — overlap-foto (klein, links-onder)", name: "hero_image_overlap", widget: "image", required: false }

          - label: "Hero — hoofdknop tekst"
            name: "hero_cta_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - { label: "Hero — hoofdknop URL", name: "hero_cta_url", widget: "string" }

          - label: "Hero — secundaire link tekst (optioneel)"
            name: "hero_secondary_label"
            widget: "object"
            required: false
            fields:
              - { label: "Nederlands", name: "nl", widget: "string", required: false }
              - { label: "English", name: "en", widget: "string", required: false }

          - { label: "Hero — secundaire link URL", name: "hero_secondary_url", widget: "string", required: false }

          # --- Lunchcafé ---
          - label: "Lunchcafé — klein label"
            name: "lunchcafe_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Lunchcafé — titel"
            name: "lunchcafe_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Lunchcafé — tekst"
            name: "lunchcafe_text"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

          - label: "Lunchcafé — chip / badge tekst"
            name: "lunchcafe_chip"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Lunchcafé — polaroid-rij (3 foto's)"
            name: "lunchcafe_polaroids"
            widget: "list"
            field: { label: "Foto", name: "image", widget: "image" }

          - label: "Lunchcafé — knop tekst"
            name: "lunchcafe_cta_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - { label: "Lunchcafé — knop URL", name: "lunchcafe_cta_url", widget: "string" }

          # --- Catering ---
          - label: "Catering — klein label"
            name: "catering_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Catering — titel"
            name: "catering_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Catering — tekst"
            name: "catering_text"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

          - { label: "Catering — foto", name: "catering_image", widget: "image" }

          - label: "Catering — knop tekst"
            name: "catering_cta_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - { label: "Catering — knop URL", name: "catering_cta_url", widget: "string" }

          # --- Evenementen teaser ---
          - label: "Evenementen — klein label"
            name: "events_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Evenementen — titel"
            name: "events_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Evenementen — tekst"
            name: "events_text"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

          - { label: "Evenementen — foto (breed)", name: "events_image", widget: "image" }

          - label: "Evenementen — knop tekst"
            name: "events_cta_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - { label: "Evenementen — knop URL", name: "events_cta_url", widget: "string" }

          # --- Instagram teaser ---
          - label: "Instagram — tekst (onder de reviews)"
            name: "instagram_text"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          # --- Closing CTA ---
          - label: "Afsluiting — klein label"
            name: "closing_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Afsluiting — titel"
            name: "closing_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Afsluiting — tekst"
            name: "closing_text"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

          - { label: "Afsluiting — foto", name: "closing_image", widget: "image" }

          - label: "Afsluiting — hoofdknop tekst"
            name: "closing_primary_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - { label: "Afsluiting — hoofdknop URL", name: "closing_primary_url", widget: "string" }

          - label: "Afsluiting — tweede knop tekst"
            name: "closing_secondary_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - { label: "Afsluiting — tweede knop URL", name: "closing_secondary_url", widget: "string" }

          - label: "Afsluiting — evenementen-link tekst (optioneel)"
            name: "closing_events_label"
            widget: "object"
            required: false
            fields:
              - { label: "Nederlands", name: "nl", widget: "string", required: false }
              - { label: "English", name: "en", widget: "string", required: false }

          - { label: "Afsluiting — evenementen-link URL", name: "closing_events_url", widget: "string", required: false }

      - label: "Lunchcafé"
        name: "lunchcafe"
        file: "src/lunchcafe.njk"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }

          - label: "Browser-titel"
            name: "title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Meta description"
            name: "description"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

          - label: "Klein label"
            name: "hero_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Titel"
            name: "hero_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - { label: "Hero foto", name: "hero_image", widget: "image" }

          - label: "Intro tekst"
            name: "intro"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "markdown" }
              - { label: "English", name: "en", widget: "markdown" }

          - label: "Intro callout (optioneel)"
            name: "intro_callout"
            widget: "object"
            required: false
            fields:
              - { label: "Nederlands", name: "nl", widget: "string", required: false }
              - { label: "English", name: "en", widget: "string", required: false }

          - label: "Menu label (bv. tijden)"
            name: "menu_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Menu titel"
            name: "menu_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Menu legenda"
            name: "menu_legend"
            widget: "object"
            collapsed: true
            fields:
              - label: "Nederlands"
                name: "nl"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - label: "English"
                name: "en"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }

          - label: "Keuken-disclaimer (optioneel)"
            name: "menu_kitchen_note"
            widget: "object"
            required: false
            fields:
              - { label: "Nederlands", name: "nl", widget: "string", required: false }
              - { label: "English", name: "en", widget: "string", required: false }

          - label: "Menu voettekst (optioneel)"
            name: "menu_footer_note"
            widget: "object"
            required: false
            fields:
              - { label: "Nederlands", name: "nl", widget: "string", required: false }
              - { label: "English", name: "en", widget: "string", required: false }

          - { label: "Extra foto (optioneel)", name: "extra_image", widget: "image", required: false }

      - label: "Catering"
        name: "catering"
        file: "src/catering.njk"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }

          - label: "Browser-titel"
            name: "title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Meta description"
            name: "description"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

          - label: "Klein label"
            name: "hero_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Titel"
            name: "hero_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Intro tekst"
            name: "hero_intro"
            widget: "object"
            collapsed: true
            fields:
