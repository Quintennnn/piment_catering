          - label: "Agenda — klein label"
            name: "agenda_label"
            widget: "object"
            hint: "De evenementen zelf voeg je toe onder 'Agenda' in het menu links. Zonder komende evenementen verdwijnt dit blok vanzelf."
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Agenda — titel"
            name: "agenda_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Agenda — intro tekst (optioneel)"
            name: "agenda_intro"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "Nederlands", name: "nl", widget: "text", required: false }
              - { label: "English", name: "en", widget: "text", required: false }

          - label: "Blok 1 (bruiloften/feesten) — klein label"
            name: "weddings_label"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

          - label: "Blok 1 — titel"
            name: "weddings_title"
            widget: "object"
            fields:
              - { label: "Nederlands", name: "nl", widget: "string" }
